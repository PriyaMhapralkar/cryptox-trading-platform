spring.application.name=cryptox-backend
server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/cryptox?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# Mail (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# CoinGecko
coingecko.api.baseurl=https://api.coingecko.com/api/v3
coingecko.api.key=${COINGECKO_API_KEY}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration.ms=86400000


# Razorpay
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# Stripe
stripe.secret.key=${STRIPE_SECRET_KEY:sk_test_default}

# Gemini
gemini.api.key=${GEMINI_API_KEY}
gemini.api.model=gemini-flash-lite-latest